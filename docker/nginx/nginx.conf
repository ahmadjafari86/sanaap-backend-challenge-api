worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # Exclude query strings, authorization headers, cookies and response bodies.
    log_format api '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout api;

    client_max_body_size 11m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream application {
        zone application 64k;
        server backend:8000 resolve;
    }

    include /etc/nginx/conf.d/*.conf;
}
